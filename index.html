<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css">
  <title>HS Tree Visualizer</title>

  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@3.0.0/cytoscape-dagre.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-elk@2.3.0/dist/cytoscape-elk.js"></script>

</head>
<body>

  <!-- TOOLBAR -->
<div class="toolbar-main">
   <div class="brand">
    <div class="brand-title">HS Tree Visualizer</div>
    <div class="brand-subtitle">Abductive reasoning visualization</div>
  </div>

  <button id="helpBtn">Help</button>

  <div class="spacer"></div>

  <!-- <input type="file" id="fileInput" />TOOLBAR -->

<label class="file-upload">
  <input type="file" id="fileInput" />
  <span class="file-btn">Upload file</span>
  <span id="fileName">No file selected</span>
</label>

<div class="radio-inputs">
  <label class="radio">
    <input type="radio" name="radio" id="treeModeRadio" checked="">
    <span class="name">Tree Mode</span>
  </label>
  <label class="radio">
    <input type="radio" name="radio" id="stepModeRadio">
    <span class="name">Step Mode</span>
  </label>
  </div>
</div>



<!-- SECONDARY TOOLBAR - TREE MODE -->
<div class="toolbar" id="treeToolbar">
  <button id="showFullTree">Show Full Tree</button>
  <button id="filterExplanations">Paths to Explanations Only</button>
  <button id="labelUpdtBtn">Hide Labels</button>
  <button id="prunnedUpdBtn">Hide prunned nodes</button>
  <button id="MXPExplenationsBtn" style="display:none;">Hide initial MXP explenations</button>

  <div class="spacer"></div>

  <button id="panelToggleBtn">ℹ Info</button>
</div>

<!-- SECONDARY TOOLBAR - STEP MODE -->
<div class="toolbar" id="stepToolbar" style="display: none;">
  
  <button id="stepBack">◀ Step Back</button>
  <button id="stepForward">Step Forward ▶</button>
  <span id="stepCounter" style="margin-left: 10px;">Step 0 / 0</span>

  <span id="stepInlineDescription">Waiting for step...</span>

  <div class="spacer"></div>

  <button id="panelToggleBtnStep">ℹ Info</button>

</div>
<!-- 
<div id="stepDescriptionBar" style="display: none;">
  Waiting for step...
</div>-->

  <!-- MAIN -->
  <div class="main">
    <div id="cy"></div>

    <div id="infoPanel" class="open">
      
      <div id="ontologyContent"  style="height: 50%; overflow-y: auto; padding-right: 5px; padding-bottom: 5px;">
        <h3>Ontology</h3>
        No data
      </div>
      <div id="infoContent" style="height: 48%; overflow-y: auto; padding-top: 5px;">
        <h3>Node Information</h3>
        Right-click on a node to see details
      </div>
    </div>
  </div>

  <div class="canvasControls">
  <button id="centerCanvas">Center</button>
  <button id="zoomIn">+</button>
  <button id="zoomOut">-</button>
  
  <div class="depthControl">
    <label for="maxDepthInput">Max depth</label>
    <input type="number" id="maxDepthInput" min="1" step="1" placeholder="all" />
  </div>
</div>
</div>



  <script src="js/cy-style.js" defer></script>
  <script src="js/tree-render.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/step-mode.js" defer></script>
  <script src="js/app.js" defer></script>
  
</body>
</html>
